<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Este meta es OBLIGATORIO para que las media queries funcionen bien en celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8 - Responsive Design</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor">
        <header class="encabezado">
            <h1>Mi sitio responsive</h1>
        </header>

        <main class="contenido">
            <p>
                Este contenedor mide 800px de ancho en pantallas grandes (escritorio),
                pero se adapta a pantallas pequeñas gracias a una media query.
                Prueba reduciendo el ancho de tu navegador o revisándolo desde el celular.
            </p>
        </main>
    </div>

</body>
</html>
