<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Selectores CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Selectores CSS</h1>

    <!-- Este párrafo NO tiene clase ni id: solo lo afecta el selector por etiqueta "p" -->
    <p>Este es un párrafo normal, estilizado únicamente por el selector de etiqueta.</p>

    <!-- Este párrafo tiene una clase, así que le aplica tanto el selector "p" como ".destacado" -->
    <p class="destacado">Este párrafo tiene una clase y se ve destacado.</p>

    <!-- Este párrafo tiene un id único, solo puede haber un elemento con este id en la página -->
    <p id="aviso">Este párrafo tiene un id y muestra un estilo de aviso importante.</p>

</body>
</html>
